<!DOCTYPE html>
<!--
  Minimal, fixed-size static fixture used by test_certificate_renderer.py to
  exercise the real Playwright rendering pipeline end-to-end (no LMS/network
  dependency). It deliberately mimics the two properties the real certificate
  template relies on:

  1. A fixed-size, non-responsive design (see the ".certificate" box below):
     `_measure_natural_size()` in certificate_renderer.py only works correctly
     for templates like this one, see that function's docstring.
  2. A "screen only" banner that must be hidden via the `@media print` rule
     when rendering, exactly like the real "you earned a certificate" banner
     injected by edx-platform (see `_print.scss` in edx-platform, and
     `_render_on_browser_thread`'s `page.emulate_media(media="print")` call).
-->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body {
    margin: 0;
    padding: 0;
  }
  .banner {
    width: 800px;
    height: 50px;
    background-color: red;
  }
  .certificate {
    width: 800px;
    height: 400px;
    background-color: green;
  }
  @media print {
    .banner {
      display: none;
    }
  }
</style>
</head>
<body>
  <div class="banner">This banner must be hidden in print/rendered output</div>
  <div class="certificate">Sample certificate content</div>
</body>
</html>
